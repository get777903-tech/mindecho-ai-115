<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ActiMind AI — Развивающая подружка Мия</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background-color: #0B0F17;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(11, 15, 23, 0.8);
      backdrop-filter: blur(10px);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
    }
    .logo span {
      color: #FF6B00;
    }
    .btn-back {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-back:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .main-container {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .express-buttons {
      display: flex;
      gap: 12px;
      width: 100%;
      flex-wrap: wrap;
    }
    .btn-express {
      flex: 1;
      min-width: 260px;
      padding: 14px 20px;
      border-radius: 16px;
      border: none;
      font-weight: 700;
      font-size: 15px;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-express:hover {
      transform: translateY(-2px);
    }
    .btn-emergency {
      background: linear-gradient(135deg, #f59e0b, #8b5cf6);
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3);
    }
    .btn-dialog {
      background: linear-gradient(135deg, #FF6B00, #FF2E93);
      box-shadow: 0 4px 20px rgba(255, 107, 0, 0.4);
    }
    .mia-avatar-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 30px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .avatar-glow {
      position: absolute;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(255, 107, 0, 0.25) 0%, rgba(255, 46, 147, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .mia-avatar {
      font-size: 64px;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }
    .mia-status {
      font-size: 18px;
      font-weight: 700;
      color: #FF6B00;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }
    .mic-button {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FF6B00, #FF2E93);
      border: none;
      color: #fff;
      font-size: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255, 107, 0, 0.6);
      transition: transform 0.2s ease;
      margin: 16px 0;
      position: relative;
      z-index: 1;
    }
    .mic-button.listening {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 107, 0, 0.7); }
      70% { box-shadow: 0 0 0 25px rgba(255, 107, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 107, 0, 0); }
    }
    .quick-topics {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 14px;
      position: relative;
      z-index: 1;
    }
    .topic-chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .topic-chip:hover {
      background: rgba(255, 107, 0, 0.3);
      border-color: #FF6B00;
      color: #fff;
    }
    .transcript-box {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 140px;
    }
    .transcript-line {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 16px;
      line-height: 1.5;
    }
    .user-line strong {
      color: #60a5fa;
    }
    .mia-line strong {
      color: #FF6B00;
    }
    .reading-highlight {
      font-size: 20px;
      font-weight: 800;
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.1);
      padding: 8px 12px;
      border-radius: 10px;
      display: inline-block;
      margin: 6px 0;
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo">
      ✨ <span>ActiMind</span> AI | Ask Mia
    </a>
    <a href="index.html" class="btn-back">⬅️ На главную</a>
  </header>

  <main class="main-container">
    <!-- 2 Главные экспресс-кнопки -->
    <div class="express-buttons">
      <button class="btn-express btn-emergency" onclick="triggerExpressEmergency()">
        🧘 Экстренная помощь при капризах
      </button>
      <button class="btn-express btn-dialog" onclick="triggerExpressDialog()">
        🌸 Диалог и совет с Мией
      </button>
    </div>

    <!-- Карточка Мии и пульсирующий микрофон -->
    <div class="mia-avatar-card">
      <div class="avatar-glow"></div>
      <div class="mia-avatar">🐱</div>
      <div class="mia-status" id="mia-status-text">🟢 Мия слушает вас...</div>
      <p style="color: #94a3b8; font-size: 14px;">Говорите свободно, или обратитесь со словом «Мия»</p>

      <button class="mic-button listening" id="mic-toggle-btn" onclick="toggleMicrophone()">
        🎙️
      </button>

      <!-- Быстрый выбор тем -->
      <div class="quick-topics">
        <button class="topic-chip" onclick="sendQuickTopic('Расскажи интересную историю про кошек и котят')">🐾 Про кошек и котят</button>
        <button class="topic-chip" onclick="sendQuickTopic('Я хочу почитать')">📖 Я хочу почитать (Тренажер)</button>
        <button class="topic-chip" onclick="sendQuickTopic('Расскажи про интересные профессии и службы в городе')">🏙️ Профессии в городе</button>
        <button class="topic-chip" onclick="sendQuickTopic('Секреты супер-силы тела и полезной еды')">🥦 Супер-еда и сила</button>
        <button class="topic-chip" onclick="sendQuickTopic('Включи сказку-медитацию на ночь')">🌙 Сказка на ночь</button>
      </div>
    </div>

    <!-- Окно живых субтитров -->
    <div class="transcript-box" id="transcript-box">
      <div class="transcript-line user-line" id="user-transcript">
        <strong>👤 Услышано:</strong> <em>«Мия, привет! О чем поболтаем?»</em>
      </div>
      <div class="transcript-line mia-line" id="mia-transcript">
        <strong>🌸 Мия говорит:</strong> <span>«Привет! Я рада тебя слышать, и мы можем поболтать о забавных котиках или почитать волшебную историю! Что выберешь ты?»</span>
      </div>
    </div>
  </main>

  <script src="gemini_service.js"></script>
  <script src="mia.js"></script>
</body>
</html>
